# Teşhis: clippy-extra tam raporu (yalnız workflow_dispatch)
#
# clippy-extra kapısı yalnız SAYIYI basar; ops/scripts/clippy-extra-report.py
# varsayılan cap'i (40/lint) ile ilk 40 isabeti basar. Ratchet bir +64 ile
# kırmızıya düştüğünde yeni uyarıların tam listesini görmek için bu iş
# CI'ı koşar ve TÜM isabetleri raporlar.
#
# Neden yorum: sandbox CI loglarını (Azure blob) okuyamıyor (bilinen
# engel); issue/PR yorumları API'den okunabilir.
#
# Kural: bu workflow bir KAPI DEĞİLDİR. Hiçbir check'i zorunlu kılmaz,
# hiçbir baseline'ı değiştirmez; yalnız rapor üretir. Kapı (ci.yml'deki
# clippy-extra adımı) aynen çalışmaya devam eder.

name: Diagnostic Clippy Full Report

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  full-report:
    name: clippy-extra tam rapor (cap'sız)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Toolchain + protoc (CI ile aynı zemin)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy
          rustup default 1.97.0
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          rustc --version && protoc --version
      - name: clippy JSON üret (kapının okuduğu komutun aynısı)
        run: |
          cargo clippy --all-targets --message-format=json -- -W clippy::pedantic -W clippy::nursery \
            > /tmp/clippy.json 2>/dev/null || true
          echo "JSON satır: $(wc -l < /tmp/clippy.json)"
      - name: Dosya bazında özet üret
        run: |
          jq -r 'select(.reason=="compiler-message" and .message.level=="warning" and ((.message.code.code // "") | startswith("clippy::"))) | [(.message.spans[0].file_name // "?"), (.message.code.code // "?"), (.message.spans[0].line_start // 0)] | @tsv' \
            /tmp/clippy.json | sort | uniq -c | sort -rn > /tmp/perfile.txt
          echo "Dosya-satır-lint satırı: $(wc -l < /tmp/perfile.txt)"
          jq -r 'select(.reason=="compiler-message" and .message.level=="warning" and ((.message.code.code // "") | startswith("clippy::"))) | .message.spans[0].file_name' \
            /tmp/clippy.json | sort | uniq -c | sort -rn > /tmp/perfile_summary.txt
          echo "--- dosya bazında toplam (ilk 30) ---"
          head -30 /tmp/perfile_summary.txt
      - name: PR #186'ya raporu yorumla (parçalı)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -E '^[0-9]+$' .github/clippy-extra-baseline.txt | head -1)
          N=$(jq -c 'select(.reason=="compiler-message" and .message.level=="warning" and ((.message.code.code // "") | startswith("clippy::")))' /tmp/clippy.json | wc -l)
          {
            echo "## Diagnostic Clippy Full Report (workflow_dispatch)"
            echo ""
            echo "**clippy-extra: $N | baseline: $BASE** (fark $((N-BASE > 0 ? N-BASE : 0)))"
            echo ""
            echo "### 1/3 - Lint bazında toplam"
            echo '```'
            jq -r 'select(.reason=="compiler-message" and .message.level=="warning" and ((.message.code.code // "") | startswith("clippy::"))) | .message.code.code' /tmp/clippy.json | sort | uniq -c | sort -rn
            echo '```'
          } > /tmp/report1.md
          gh pr comment 186 --repo budlum-xyz/budlum --body-file /tmp/report1.md
          {
            echo "### 2/3 - Dosya bazında toplam uyarı sayısı"
            echo '```'
            cat /tmp/perfile_summary.txt
            echo '```'
          } > /tmp/report2.md
          gh pr comment 186 --repo budlum-xyz/budlum --body-file /tmp/report2.md
          {
            echo "### 3/3 - Dosya:satır:lint (tam liste, cap yok)"
            echo '```'
            cat /tmp/perfile.txt
            echo '```'
          } > /tmp/report3.md
          split -b 50000 -d /tmp/report3.md /tmp/report3_
          for f in /tmp/report3_*; do
            gh pr comment 186 --repo budlum-xyz/budlum --body-file "$f"
          done
