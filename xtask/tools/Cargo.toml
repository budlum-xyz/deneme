[package]
name = "budlum-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "Apache-2.0"
description = "Repository tooling (SBOM, audit, coverage, genesis checks), written in Rust rather than shell."
publish = false

[dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
